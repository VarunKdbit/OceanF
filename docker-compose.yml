version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oceanembed
      POSTGRES_USER: oceanembed
      POSTGRES_PASSWORD: oceanembed
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ml-service:
    build: ./ml-service
    ports:
      - "8000:8000"
    environment:
      OCEANEMBED_MODEL_VERSION: oceanembed-v1.0

  backend-api:
    build: ./backend-api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: oceanembed
      DB_USER: oceanembed
      DB_PASSWORD: oceanembed
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      - postgres
      - ml-service

volumes:
  pgdata:
